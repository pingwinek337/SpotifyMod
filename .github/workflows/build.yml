name: Build jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jar
        run: |
          mkdir -p dist
          cp "$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" dist/spotify-hud.jar
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: spotify-hud
          path: dist/spotify-hud.jar

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/spotify-hud.jar \
            --title "Spotify HUD (najnowszy build)" \
            --notes "Mod Fabric 1.21.4. Wymaga Fabric API. Wrzuć spotify-hud.jar do .minecraft/mods." \
            --target "$GITHUB_SHA"
